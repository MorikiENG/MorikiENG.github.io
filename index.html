<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moriki Engineering</title>

    <meta name="description"
          content="Moriki Engineeringのアプリ・サービス情報を掲載しています。">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Helvetica Neue",
                "Hiragino Kaku Gothic ProN",
                "Yu Gothic",
                sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        header {
            background: white;
            text-align: center;
            padding: 70px 20px 50px;
            border-bottom: 1px solid #e5e5e5;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        header p {
            margin-top: 12px;
            color: #666;
            font-size: 17px;
        }

        main {
            max-width: 760px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            margin-bottom: 20px;
            font-size: 24px;
        }

        .app-card {
            background: white;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        .app-card h2 {
            margin: 0 0 8px;
            font-size: 25px;
        }

        .app-card .subtitle {
            margin-bottom: 20px;
            color: #555;
            font-size: 16px;
        }

        .app-card p {
            line-height: 1.8;
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 24px;
        }

        .links a {
            display: inline-block;
            padding: 11px 18px;
            border-radius: 10px;
            background: #007aff;
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .links a.secondary {
            background: #eef1f5;
            color: #333;
        }

        footer {
            margin-top: 70px;
            padding: 30px 20px;
            text-align: center;
            color: #888;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            header {
                padding-top: 50px;
            }

            header h1 {
                font-size: 30px;
            }

            .app-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Moriki Engineering</h1>
    <p>Apps &amp; Engineering</p>
</header>

<main>

    <h2 class="section-title">Apps</h2>

    <section class="app-card">

        <h2>画像圧縮くん</h2>

        <div class="subtitle">
            画像を指定容量以下にかんたん圧縮
        </div>

        <p>
            「画像圧縮くん」は、画像を選んで目標容量を指定するだけで、
            かんたんに画像を圧縮できるiPhoneアプリです。
        </p>

        <p>
            2MB以下・1MB以下・500KB以下・200KB以下から
            目標容量を選択できます。
        </p>

        <div class="links">

            <a href="https://apps.apple.com/jp/app/id6814366397">
                App Store
            </a>

            <a class="secondary"
               href="/moriki-apps/privacy-image-compressor.html">
                Privacy Policy
            </a>

            <a class="secondary"
               href="/moriki-apps/support-image-compressor.html">
                Support
            </a>

        </div>

    </section>

</main>

<footer>
    © 2026 Moriki Engineering
</footer>

</body>
</html>
